name: Build Pokemon Purple FAP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: release
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-purple-fap
          path: dist/*.fap
          if-no-files-found: error
